[project]
name = "aep-example-custom-provider-plugin"
version = "0.1.0"
description = "Reference ClaudeProvider plugin built against aep-provider-sdk and the official Anthropic SDK"
requires-python = ">=3.11"
dependencies = [
    "aep-provider-sdk",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/custom_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
