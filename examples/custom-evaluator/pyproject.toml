[project]
name = "aep-example-custom-evaluator"
version = "0.1.0"
description = "Reference UnitTestEvaluator plugin built against aep-eval-sdk"
requires-python = ">=3.11"
dependencies = [
    "aep-eval-sdk",
    "pytest>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/custom_evaluator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
