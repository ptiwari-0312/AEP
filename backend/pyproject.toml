[project]
name = "aep-backend"
version = "0.1.0"
description = "AEP modular monolith backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "python-jose[cryptography]>=3.3",
    "aep-provider-sdk",
    "aep-agent-sdk",
    "aep-eval-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() in argument defaults is the framework's documented dependency-
# injection idiom, not the mutable-default-argument bug B008 exists to catch.
"src/aep/**/api/*.py" = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
