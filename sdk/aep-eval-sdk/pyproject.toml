[project]
name = "aep-eval-sdk"
version = "0.1.0"
description = "AEP Evaluator plugin interface — implement this to add a quality-gate evaluator (DeepEval, Promptfoo, unit tests, security scans, ...)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/aep_eval_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
