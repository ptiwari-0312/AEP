[project]
name = "aep-provider-sdk"
version = "0.1.0"
description = "AEP Model Provider plugin interface — implement this to add an LLM provider (Claude, OpenAI, Gemini, Vertex AI, or your own)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/aep_provider_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
